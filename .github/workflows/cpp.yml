name: C++ CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            cmake_flags: ''
          - compiler: clang
            cc: clang
            cxx: clang++
            cmake_flags: ''
          - compiler: gcc-sanitizers
            cc: gcc
            cxx: g++
            cmake_flags: '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure
      run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_flags }}
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}

    - name: Build
      run: cmake --build cpp/build --parallel

    - name: Test
      working-directory: cpp/build
      run: ctest --output-on-failure
